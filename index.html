<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Vilkron</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Nunito:wght@500;700&display=swap">
<style>
/* HUD de jogo de celular: informações no topo, joystick à esquerda, combate à direita, itens embaixo no centro */
:root {
  --chao: #1a2418;
  --painel: rgba(16, 22, 18, 0.74);
  --linha: rgba(232, 214, 160, 0.28);
  --texto: #f3ecd8;
  --apagado: #b9b29c;
  --ouro: #e3b44c;
  --vida: #4ade80;
  --perigo: #ef4444;
  --hud: "Chakra Petch", "Trebuchet MS", system-ui, sans-serif;
  --corpo: "Nunito", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--chao); color: var(--texto); font-family: var(--corpo); overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
[hidden] { display: none !important; }
#jogo { position: fixed; inset: 0; }
#jogo canvas { display: block; width: 100%; height: 100%; }
button { font: inherit; color: inherit; }

.hud { position: fixed; z-index: 5; }
.caixa { background: var(--painel); border: 1px solid var(--linha); border-radius: 10px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }

/* topo */
#topo { top: calc(8px + env(safe-area-inset-top, 0px)); left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px));
  display: flex; gap: 8px; align-items: flex-start; pointer-events: none; }
#bMenu { pointer-events: auto; width: 40px; height: 44px; display: grid; place-items: center; cursor: pointer; padding: 0; }
#bMenu i { display: block; width: 5px; height: 5px; border-radius: 50%; background: var(--texto); box-shadow: 0 -9px 0 var(--texto), 0 9px 0 var(--texto); }
#painel { padding: 6px 10px; min-width: 0; flex: 1; max-width: 420px; }
#hudMapa { font-family: var(--hud); font-weight: 700; letter-spacing: 0.04em; font-size: 14px; }
#hudRank { font-size: 12px; color: var(--apagado); }
#hudRank b { color: var(--ouro); }
#hudRank .prot { color: #9fd8ff; }
.vida { position: relative; height: 12px; border-radius: 6px; background: rgba(0,0,0,0.5); margin-top: 5px; overflow: hidden; }
#hudVida { height: 100%; width: 100%; background: var(--vida); transition: width 0.15s; }
#hudVidaTxt { position: absolute; inset: 0; font-size: 9px; line-height: 12px; text-align: center; font-family: var(--hud); }
#hudTags { font-size: 11px; color: #9fd8ff; margin-top: 3px; min-height: 14px; }
#ouro { padding: 6px 10px; flex: none; font-family: var(--hud); font-weight: 700; color: var(--ouro); white-space: nowrap; pointer-events: auto; }
#ouro::before { content: "●"; margin-right: 5px; }

#menu { top: calc(58px + env(safe-area-inset-top, 0px)); left: max(10px, env(safe-area-inset-left, 0px)); display: grid; gap: 2px; padding: 6px; min-width: 210px; }
#menu button { text-align: left; background: none; border: 0; padding: 9px 10px; border-radius: 6px; cursor: pointer; font-size: 14px; }
#menu button:hover, #menu button:focus-visible { background: rgba(227,180,76,0.18); outline: none; }
#menu hr { border: 0; border-top: 1px solid var(--linha); margin: 4px 0; width: 100%; }

/* combate */
#botoes { right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: 200px; height: 190px; }
.btn { position: absolute; border-radius: 50%; border: 2px solid var(--linha); background: var(--painel); font-family: var(--hud); font-weight: 700;
  display: grid; place-items: center; text-align: center; line-height: 1.05; cursor: pointer; padding: 0; touch-action: none; overflow: hidden; --cd: 0%; }
.btn::after { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,0.55); clip-path: inset(calc(100% - var(--cd)) 0 0 0); pointer-events: none; }
.btn span { font-size: 11px; position: relative; z-index: 1; }
.btn b { position: absolute; z-index: 2; font-size: 18px; color: var(--texto); }
.btn.ativo { border-color: var(--ouro); background: rgba(227,180,76,0.3); }
#bAtaque { width: 88px; height: 88px; right: 0; bottom: 0; border-color: rgba(227,180,76,0.6); }
#bAtaque span { font-size: 14px; }
#bHab1 { width: 62px; height: 62px; right: 98px; bottom: 4px; }
#bHab2 { width: 62px; height: 62px; right: 66px; bottom: 94px; }
#bHab3 { width: 62px; height: 62px; right: 0; bottom: 100px; }
.btn.ult { border-color: rgba(197,139,255,0.75); box-shadow: 0 0 0 2px rgba(197,139,255,0.25); }
.btn.ult::before { content: "ULT"; position: absolute; top: 5px; left: 0; right: 0; font-size: 8px; letter-spacing: 0.1em; color: #d9b8ff; }

#bInteragir { right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(214px + env(safe-area-inset-bottom, 0px)); padding: 10px 16px; border-radius: 22px;
  background: var(--ouro); color: #1a1408; border: 0; font-family: var(--hud); font-weight: 700; cursor: pointer; }

#itens { left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 6px; padding: 5px; }
#itens button { width: 42px; height: 42px; border-radius: 8px; border: 1px solid var(--linha); background: rgba(0,0,0,0.3); position: relative; cursor: pointer; padding: 0; touch-action: none; }
#itens button:disabled { opacity: 0.4; }
#itens button em { font-style: normal; font-size: 18px; }
#itens button i { position: absolute; right: 2px; bottom: 1px; font-style: normal; font-size: 10px; font-family: var(--hud); color: var(--ouro); }

#joy { position: fixed; z-index: 4; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 2px solid var(--linha); background: rgba(16,22,18,0.35); pointer-events: none; }
#joy i { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(243,236,216,0.55); border: 2px solid var(--ouro); }

#aviso { top: calc(96px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); padding: 8px 14px; font-family: var(--hud); font-size: 13px; color: var(--ouro); max-width: 88vw; text-align: center; pointer-events: none; }

/* janelas */
#modal { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(0,0,0,0.5); padding-inline: max(14px, env(safe-area-inset-left, 0px)); }
#modalCaixa { width: min(520px, 100%); max-height: 84vh; overflow: auto; padding: 16px; border-radius: 14px; }
#modalTopo { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; }
#modalTitulo { font-family: var(--hud); font-size: 18px; margin: 0; color: var(--ouro); letter-spacing: 0.03em; }
#modalFechar { background: none; border: 1px solid var(--linha); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
#modalCorpo { font-size: 14px; line-height: 1.45; }
#modalCorpo ul { padding-left: 18px; margin: 6px 0; }
#modalCorpo li { margin: 4px 0; }
.nota { color: var(--apagado); font-size: 13px; }
#cinematica { position: fixed; inset: 0; z-index: 9999; background: #000; display: flex; align-items: center; justify-content: center; }
#cinematica video { width: 100%; height: 100%; object-fit: contain; background: #000; }
#cinematica .pular { position: absolute; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); padding: 10px 18px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.5); background: rgba(0,0,0,0.55); color: #fff; font-weight: 700; font-size: 15px; }
#cinematica .pular:disabled { opacity: 0.6; }
#cinematica .som { position: absolute; left: calc(16px + env(safe-area-inset-left, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); padding: 10px 16px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.5); background: rgba(0,0,0,0.55); color: #fff; font-size: 15px; }
.rotulo.inline { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; }
.evento { border: 1px solid #e3b44c; border-radius: 10px; padding: 8px 10px; margin: 8px 0; background: rgba(227,180,76,0.12); font-size: 13px; line-height: 1.5; }
.form.meta { border-top: 1px dashed rgba(255,255,255,0.15); padding-top: 8px; }
.linha { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--linha); flex-wrap: wrap; }
.linha > div:first-child { min-width: 0; flex: 1; }
.linha small { display: block; color: var(--apagado); font-size: 12px; }
.linha.bloco { align-items: flex-start; }
.dir { text-align: right; display: grid; gap: 3px; justify-items: end; }
.preco { font-family: var(--hud); color: var(--ouro); }
.botoes { display: flex; gap: 6px; flex-wrap: wrap; }
.acao { background: rgba(227,180,76,0.16); border: 1px solid rgba(227,180,76,0.5); border-radius: 8px; padding: 7px 12px; cursor: pointer; font-family: var(--hud); }
.acao.fina { padding: 5px 9px; font-size: 12px; }
.acao.forte { background: var(--ouro); color: #1a1408; border-color: var(--ouro); font-weight: 700; }
.acao:disabled { opacity: 0.4; cursor: default; }
.acao.sel, .classe.sel { border-color: var(--ouro); box-shadow: 0 0 0 1px var(--ouro); }
.classes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 6px; }
.classe { text-align: left; padding: 10px; border-radius: 10px; border: 1px solid var(--linha); background: rgba(0,0,0,0.25); cursor: pointer; }
.classe b { font-family: var(--hud); display: block; }
.classe small { display: block; color: var(--apagado); font-size: 12px; }
.cores { display: flex; gap: 6px; flex-wrap: wrap; }
.cor { width: 26px; height: 26px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.35); cursor: pointer; padding: 0; }
.cor.sel { border-color: var(--texto); box-shadow: 0 0 0 2px var(--ouro); }
ol.rank { padding-left: 0; list-style: none; margin: 0 0 8px; }
ol.rank li { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid var(--linha); font-variant-numeric: tabular-nums; }
.minha b { color: var(--ouro); }
button:focus-visible { outline: 2px solid var(--ouro); outline-offset: 2px; }

#carregando { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: var(--chao); font-family: var(--hud); letter-spacing: 0.08em; color: var(--ouro); text-align: center; padding-inline: 16px; }
#carregando p { font-family: var(--corpo); color: var(--apagado); font-size: 13px; letter-spacing: 0; }
/* minimapa e menu do administrador */
#miniVaga { position: relative; width: 64px; height: 64px; flex: none; }
#minimapa { position: absolute; left: 0; top: 0; z-index: 2; pointer-events: auto; width: 64px; height: 64px; padding: 0; border-radius: 10px; touch-action: manipulation; }
#minimapa.grande { width: 150px; height: 150px; }
#bAdmin { pointer-events: auto; width: 40px; height: 44px; display: grid; place-items: center; cursor: pointer; padding: 0; flex: none; }
#bAdmin i { display: block; width: 18px; height: 2px; border-radius: 2px; background: var(--ouro); box-shadow: 0 -6px 0 var(--ouro), 0 6px 0 var(--ouro); }

/* telas do modo online */
#telaOnline { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 16px; background: radial-gradient(ellipse at 50% 30%, #2a3a24, var(--chao)); }
#telaOnline .cartao { width: min(400px, 100%); padding: 22px 18px; display: grid; gap: 12px; text-align: center; }
.abas.centro { justify-content: center; }
.link { background: none; border: 0; color: var(--ouro); text-decoration: underline; cursor: pointer; font-size: 14px; padding: 4px; }
.certo { color: #9ff0b0; margin: 0; }
#telaOnline h1 { margin: 0; font-family: var(--hud); letter-spacing: 0.12em; color: var(--ouro); font-size: 26px; }
.grande { padding: 12px 16px; font-size: 16px; }
.erro { color: #ffb4a8; margin: 0; }
.campo { width: 100%; min-width: 0; background: rgba(0,0,0,0.35); border: 1px solid var(--linha); border-radius: 8px; padding: 9px 10px; color: var(--texto); font: inherit; font-size: 16px; }
.campo.curto { width: 110px; flex: none; }
select.campo { appearance: auto; }
.form { display: grid; gap: 8px; margin: 6px 0 4px; }
.linha2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.rotulo { display: grid; gap: 4px; font-size: 12px; color: var(--apagado); }
.abas { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 4px; -webkit-overflow-scrolling: touch; }
.aba { flex: none; background: rgba(0,0,0,0.25); border: 1px solid var(--linha); border-radius: 16px; padding: 6px 12px; cursor: pointer; font-size: 13px; white-space: nowrap; }
.aba.sel { background: var(--ouro); color: #1a1408; border-color: var(--ouro); font-weight: 700; }
.sub { font-family: var(--hud); font-size: 15px; color: var(--ouro); margin: 14px 0 4px; }
#modalCorpo h4 { margin: 12px 0 2px; font-size: 13px; color: var(--apagado); text-transform: uppercase; letter-spacing: 0.06em; }
.ficha { border-top: 1px solid var(--linha); margin-top: 10px; }
.resultado { width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; cursor: pointer; text-align: left; }
small.inline { display: inline; color: var(--apagado); font-size: 12px; }
.online { color: var(--vida) !important; }
.grandeId { font-family: var(--hud); font-size: 28px; color: var(--ouro); }
.tabela { display: grid; gap: 4px; margin: 6px 0 8px; }
.tabela .cab, .tabela .lin { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr); gap: 6px; align-items: center; }
.tabela .cab { font-size: 12px; color: var(--apagado); }
.tabela .lin span { font-size: 13px; }
.tabela .campo::placeholder { color: rgba(243,236,216,0.35); }
@media (max-width: 420px) { #botoes { transform: scale(0.88); transform-origin: right bottom; } #itens button { width: 38px; height: 38px; } }
/* celular em pé: os itens sobem para a esquerda para não ficar embaixo das habilidades */
@media (max-width: 560px) { #itens { left: max(10px, env(safe-area-inset-left, 0px)); transform: none; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); flex-direction: column; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="jogo"></div>

<div id="topo" class="hud">
  <button id="bMenu" class="caixa" type="button" aria-label="Menu"><i></i></button>
  <div id="painel" class="caixa">
    <div id="hudMapa">…</div>
    <div id="hudRank"></div>
    <div class="vida"><div id="hudVida"></div><div id="hudVidaTxt"></div></div>
    <div id="hudTags"></div>
  </div>
  <div id="ouro" class="caixa"><span id="hudOuro">0</span></div>
</div>

<div id="menu" class="hud caixa" hidden>
  <button type="button" data-menu="clas">Ranking de Clãs</button>
  <button type="button" data-menu="players">Ranking de Players</button>
  <button type="button" data-menu="farm">Ranking de Farme</button>
  <button type="button" data-menu="top">Ranking Top</button>
  <hr>
  <button type="button" data-menu="passaportes">Passaportes</button>
  <button type="button" data-menu="heroi">Trocar herói ou cor</button>
  <button type="button" data-menu="instrucoes">Como jogar</button>
  <button type="button" data-menu="graficos">Gráficos</button>
</div>

<div id="aviso" class="hud caixa" hidden></div>
<div id="joy" hidden><i></i></div>
<div id="mira" hidden></div>

<button id="bInteragir" class="hud" type="button" hidden>Interagir</button>

<div id="itens" class="hud caixa" aria-label="Itens">
  <button id="item_cura" type="button" title="Frasco de cura"><em>❤</em><i>0</i></button>
  <button id="item_vel" type="button" title="Frasco de velocidade"><em>»</em><i>0</i></button>
  <button id="item_invis" type="button" title="Frasco de invisibilidade"><em>◌</em><i>0</i></button>
  <button id="item_relogio" type="button" title="Relógio que para o tempo (arraste para mirar)"><em>◷</em><i>0</i></button>
  <button id="item_cacador" type="button" title="Frasco caçador experiente"><em>✶</em><i>0</i></button>
</div>

<div id="botoes" class="hud" aria-label="Combate">
  <button class="btn" id="bAtaque" type="button"><span>Ataque</span><b></b></button>
  <button class="btn" id="bHab1" type="button"><span>1</span><b></b></button>
  <button class="btn" id="bHab2" type="button"><span>2</span><b></b></button>
  <button class="btn ult" id="bHab3" type="button"><span>3</span><b></b></button>
</div>

<div id="modal" hidden>
  <div id="modalCaixa" class="caixa" role="dialog" aria-modal="true" aria-labelledby="modalTitulo">
    <div id="modalTopo"><h2 id="modalTitulo"></h2><button id="modalFechar" type="button">Fechar</button></div>
    <div id="modalCorpo"></div>
  </div>
</div>

<div id="carregando"><div>CARREGANDO<p>Baixando o mapa e os heróis</p></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<!-- brilho na tela (bloom) -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/GammaCorrectionShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.1/dist/umd/supabase.js"></script>
<script src="servidor.js?v=23"></script>
<script src="config-online.js?v=23"></script>
<script src="efeitos.js?v=23"></script>
<script src="skins.js?v=23"></script>
<script src="mapas.js?v=23"></script>
<script src="rede.js?v=23"></script>
<script src="jogo.js?v=23"></script>
<script src="painel.js?v=23"></script>
</body>
</html>

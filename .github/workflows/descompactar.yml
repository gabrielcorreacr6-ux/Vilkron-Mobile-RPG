name: Descompactar o jogo
on:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/descompactar.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  descompactar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Abrir os zips
        run: |
          shopt -s nullglob
          zips=( *.zip )
          [ ${#zips[@]} -eq 0 ] && exit 0
          for z in "${zips[@]}"; do
            if grep -q "supabase.co" config-online.js 2>/dev/null; then
              unzip -o "$z" -x config-online.js '.github/*' || [ $? -eq 11 ]
            else
              unzip -o "$z" -x '.github/*' || [ $? -eq 11 ]
            fi
            git rm -q --cached "$z" || true
            rm -f "$z"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Descompacta os arquivos do jogo" || exit 0
          git push
      - name: Atualizar o site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
